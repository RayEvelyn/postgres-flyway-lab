services:
  database:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: homelab
      POSTGRES_USER: migration_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration_owner -d homelab"]
      interval: 2s
      timeout: 3s
      retries: 30
    # No published database port: reachable only inside this Compose project.
  flyway:
    image: redgate/flyway:13.9.0@sha256:bb1974d16bd374dd32582c93cfc7965b27664e4720a4b243f74c00f74c157745
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-ec"]
    command: ['export FLYWAY_PASSWORD="$$(cat /run/secrets/db_password)"; exec flyway "$${@}"', "flyway", "info"]
    environment:
      FLYWAY_URL: jdbc:postgresql://database:5432/homelab
      FLYWAY_USER: migration_owner
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    secrets: [db_password]
    volumes: ["./sql:/flyway/sql:ro"]
    depends_on:
      database:
        condition: service_healthy
    profiles: [tools]
secrets:
  db_password:
    file: ./secrets/db_password
volumes:
  database:
